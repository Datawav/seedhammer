name: "Test"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26'
    - run: CGO_ENABLED=0 go test ./...
  # The docs doctor: screenshots regenerate byte-identical, image
  # references resolve both ways, prose passes the mechanical house
  # rules. The same check the tracked hooks run; this is the net under
  # --no-verify and clones without the hooks.
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26'
    - run: go run ./cmd/docs
